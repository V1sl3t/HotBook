events {}

http {
    server_tokens off;

    gzip on;
    gzip_types application/json text/css application/javascript text/plain;
    gzip_min_length 1024;

    # Чуть больше MAX_UPLOAD_BYTES (5 МБ): приложение само вернёт понятную ошибку 413.
    client_max_body_size 6m;

    upstream hotbook_api {
        server api:8000;
    }

    server {
        listen 80;
        server_name hotbook.run.place;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name hotbook.run.place;

        ssl_certificate /etc/letsencrypt/live/hotbook.run.place/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hotbook.run.place/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Метрики Prometheus доступны только изнутри docker-сети.
        location = /metrics {
            return 404;
        }

        location / {
            proxy_pass http://hotbook_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
